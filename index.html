<!doctype html>
<html lang="en">
<head>

<title>Ghast</title>

<style>
:root{
  --bg:#141414; --bg2:#1c1c1e; --card:#232326; --card2:#2d2d31; --line:rgba(255,255,255,.07);
  --tx:#fff; --mut:#8f8f9b; --soft:#5f5f6b;
  --ac:#ab9ff2; --ac2:#9b8ee8; --acd:#3d3686; --acbg:rgba(171,159,242,.15);
  --up:#2fe08b; --dn:#ff5c5c; --warn:#f5c842;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0a0b;color:var(--tx);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 50% -10%,rgba(171,159,242,.10),transparent),#0a0a0b}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:0;width:100%;min-width:0}
svg{display:block;flex:none}
#app{position:relative;width:100%;height:100vh;height:100dvh;max-width:430px;background:var(--bg);overflow:hidden}
@media(min-width:520px){#app{height:min(880px,94vh);border-radius:34px;border:1px solid #2b2b30;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 140px rgba(171,159,242,.07)}}
.screen{position:absolute;inset:0;bottom:calc(64px + var(--safe-b));overflow-y:auto;overscroll-behavior:contain;padding-top:var(--safe-t);display:none;scrollbar-width:none}
.screen::-webkit-scrollbar,.dscroll::-webkit-scrollbar,.sh-body::-webkit-scrollbar{display:none}
.screen.on{display:block}
.pad{padding:18px 16px 24px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--mut)}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(20,20,20,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;z-index:10}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--soft);transition:color .15s}
.nb.on{color:var(--ac)}
/* home */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0}
.acct{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:99px;font-weight:600;font-size:15px}
.acct:active{background:var(--card)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#ab9ff2,#534bb1);display:flex;align-items:center;justify-content:center}
.tr{display:flex;gap:2px}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ib:active{background:var(--card)}
.bal{text-align:center;padding:26px 16px 6px}
.balv{font-size:46px;font-weight:600;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums;display:inline-block;padding:0 6px;border-radius:14px;transition:background .18s}
.balv:active{background:var(--card)}
.balv.pop{animation:pop .5s ease-out}
@keyframes pop{0%{background:var(--acbg);color:var(--ac)}100%{background:transparent;color:var(--tx)}}
.upd{margin-top:9px;font-size:11.5px;color:var(--soft);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.chg{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:5px 12px;border-radius:99px;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chg.up{background:rgba(47,224,139,.12)} .chg.dn{background:rgba(255,92,92,.12)} .chg.flat{background:var(--card);color:var(--mut)}
.chg .lbl{font-weight:500;color:var(--mut);font-size:12px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px 16px 6px}
.act{background:var(--card);border-radius:18px;padding:13px 0 11px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:#e8e8ee;transition:transform .1s,background .15s}
.act svg{color:var(--ac)}
.act:active{transform:scale(.96);background:var(--card2)}
.sec{padding:22px 18px 6px;font-size:14px;font-weight:600;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer}
.row:active{background:var(--card)}
.row .mid{flex:1;min-width:0}
.t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.t2{font-size:13.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.t2.up{color:var(--up)} .t2.dn{color:var(--dn)}
.rt{text-align:right;flex:none;max-width:45%}
.spark{width:56px;height:26px;flex:none}
.spark path{fill:none;stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.foot-note{padding:26px 24px 30px;text-align:center;font-size:12px;color:var(--soft);line-height:1.5}
.ci{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;color:#fff;font-weight:700;overflow:hidden;line-height:1;user-select:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.tag.r{background:rgba(255,92,92,.16);color:var(--dn)} .tag.n{background:var(--acbg);color:var(--ac)}
/* generic */
.card{background:var(--card);border-radius:18px}
.btn{height:52px;border-radius:16px;background:var(--ac);color:#0c0c0e;font-weight:600;font-size:16px;width:100%;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.985);filter:brightness(.95)}
.btn:disabled{background:var(--card2);color:var(--soft);transform:none}
.btn.sec{background:var(--card2);color:#fff}
.btn.sell{background:rgba(255,92,92,.15);color:var(--dn)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:var(--card);color:var(--mut);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:var(--acbg);color:var(--ac)}
.chips.sm .chip{padding:4px 9px;font-size:12px}
.card .chip{background:var(--card2)}
.card .chip.on{background:var(--acbg)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;height:46px;margin:14px 0 12px;color:var(--mut)}
.search input{font-size:16px}
.rowhead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px;gap:8px}
.rowhead .lab{font-size:12.5px;color:var(--soft);font-weight:500}
.empty{text-align:center;color:var(--mut);padding:50px 30px;font-size:14px;line-height:1.5}
/* swap */
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.pillb{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.sc{padding:14px 16px 12px}
.sc-top{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:500}
.sc-mid{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.sc-mid input,.sc-mid .big{font-size:32px;font-weight:600;letter-spacing:-.02em;min-width:0;flex:1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-mid .big.z{color:var(--soft)}
.sc-bot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);min-height:26px;font-variant-numeric:tabular-nums}
.tchip{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:99px;padding:5px 10px 5px 5px;font-weight:600;font-size:15px;flex:none}
.flipwrap{display:flex;justify-content:center;height:0;position:relative;z-index:2}
.flip{width:38px;height:38px;border-radius:50%;background:var(--card2);border:4px solid var(--bg);display:flex;align-items:center;justify-content:center;position:relative;top:-19px;color:var(--ac)}
.info{margin:12px 0 14px;padding:6px 16px}
.irow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13.5px;color:var(--mut)}
.irow b{color:#fff;font-weight:500;text-align:right}
.irow b.dn{color:var(--dn)} .irow b.warn{color:var(--warn)}
.sc + .flipwrap + .sc{margin-top:4px}
#s-swap .card+.flipwrap{margin:0}
/* detail */
#detail{position:absolute;inset:0;background:var(--bg);z-index:30;transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:var(--safe-t)}
#detail.on{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:54px}
.dhead .ttl{flex:1;text-align:center;font-weight:600;font-size:16px}
.dscroll{flex:1;overflow-y:auto;padding-bottom:100px}
.dprice{padding:4px 18px 0}
.dprice .pv{font-size:38px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.dprice .pc{font-size:15px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.dprice .pc small{color:var(--mut);font-weight:500;margin-left:6px;font-size:13px}
.chart{position:relative;height:210px;margin:10px 0 6px;touch-action:none;cursor:crosshair}
.chart svg{width:100%;height:100%;display:block}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.dot{position:absolute;left:0;width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px}
.dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:inherit;opacity:.35;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.xh{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);display:none}
.xd{position:absolute;width:10px;height:10px;border-radius:50%;margin:-5px 0 0 -5px;border:2px solid var(--bg);display:none}
.tfs{display:flex;justify-content:space-between;padding:0 14px}
.tf{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mut)}
.tf.on{background:var(--acbg);color:var(--ac)}
.dsec{padding:20px 16px 0}
.dsec h3{font-size:15px;font-weight:600;margin:0 2px 10px}
.pos{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pos .k{font-size:12.5px;color:var(--mut)} .pos .v{font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border-radius:14px;padding:11px 14px}
.stat .k{font-size:12px;color:var(--mut)} .stat .v{font-size:15px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.shield{padding:14px 16px}
.shield .hd{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px}
.risk{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.risk.low{background:rgba(47,224,139,.14);color:var(--up)} .risk.med{background:rgba(245,200,66,.14);color:var(--warn)} .risk.high{background:rgba(255,92,92,.15);color:var(--dn)}
.shield p{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.5}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:rgba(255,92,92,.12);color:var(--dn);font-size:13.5px;line-height:1.45;font-weight:500}
.about{font-size:14px;line-height:1.55;color:#c9c9d2;padding:0 2px}
.addr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px 14px;background:var(--card);border-radius:14px;font-size:13px;color:var(--mut)}
.addr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dfoot{position:absolute;left:0;right:0;bottom:0;padding:26px 16px calc(14px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 38%);display:flex;gap:10px}
/* sheets */
#sheets{position:absolute;inset:0;z-index:50;pointer-events:none}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .2s;pointer-events:auto}
.sbg.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--bg2);border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .27s cubic-bezier(.2,.8,.2,1);pointer-events:auto;display:flex;flex-direction:column;padding-bottom:var(--safe-b);border-top:1px solid var(--line)}
.sheet.on{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px;font-weight:600;font-size:17px}
.sh-x{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.sh-body{overflow-y:auto;min-height:0;padding:6px 16px 18px}
.field{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:6px}
.field input{font-size:16px}
.frow{display:flex;align-items:center;gap:10px}
.mini{font-size:12.5px;font-weight:600;color:var(--ac);padding:5px 10px;background:var(--acbg);border-radius:99px;flex:none}
.rv{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 14px}
.rv .amt{font-size:26px;font-weight:600;letter-spacing:-.02em}
.rv .sub{font-size:13.5px;color:var(--mut)}
.rv .arrow{color:var(--mut);margin:2px 0}
.big-ok{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:14px auto 12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.center{text-align:center}
.center h2{font-size:21px;font-weight:600;margin-bottom:6px}
.center p{color:var(--mut);font-size:14.5px;line-height:1.5;margin-bottom:18px;padding:0 6px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(0,0,0,.25);border-top-color:#0c0c0e;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:500}
.set:last-child{border:0}
.set .d{font-size:12.5px;color:var(--mut);font-weight:400;margin-top:2px}
.qr{display:flex;justify-content:center;padding:6px 0 14px}
.qr svg{border-radius:16px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;font-size:14px;color:var(--mut)}
.kv b{color:#fff;font-weight:500;text-align:right;word-break:break-all}
.aico{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ac);flex:none}
/* toast */
#toasts{position:absolute;left:12px;right:12px;top:calc(10px + var(--safe-t));z-index:90;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.toast{pointer-events:auto;background:#2a2a2f;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.2,.9,.3,1.1);line-height:1.35}
.toast.out{opacity:0;transform:translateY(-10px);transition:.25s}
.toast.bad svg{color:var(--dn)} .toast.good svg{color:var(--up)} .toast svg{color:var(--ac)}
@keyframes tin{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
/* lock */
#lock{position:absolute;inset:0;z-index:80;background:radial-gradient(600px 400px at 50% 0%,rgba(171,159,242,.22),transparent),var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px calc(28px + var(--safe-b));text-align:center}
#lock.on{display:flex}
#catch{position:absolute;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center}
#catch.on{display:flex}
#catch .logo{animation:float 4s ease-in-out infinite}
#catch .cl{font-size:15px;color:var(--mut);font-weight:500}
#catch .bar{width:180px;height:4px;border-radius:99px;background:var(--card);overflow:hidden}
#catch .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .12s}
.away-l{color:var(--mut);font-size:14px;margin:0 0 12px}
.away{padding:14px 16px;margin-bottom:8px}.away .k{font-size:12.5px;color:var(--mut)}.away .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
#lock .logo{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#lock h1{margin-top:22px;font-size:30px}
#lock p{color:var(--mut);margin:8px 0 26px;font-size:15px;line-height:1.5}
#lock .field{width:100%;text-align:left}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="solg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9945FF"/><stop offset="1" stop-color="#14F195"/></linearGradient></defs></svg>
<div id="app">
  <section id="s-home" class="screen on"></section>
  <section id="s-swap" class="screen"></section>
  <section id="s-explore" class="screen"></section>
  <section id="s-activity" class="screen"></section>
  <nav id="nav"></nav>
  <div id="detail"></div>
  <div id="sheets"></div>
  <div id="toasts"></div>
  <div id="lock"></div>
</div>

<script>
'use strict';
/* ============================================================
   GHAST — a prop crypto wallet. All prices, coins and balances
   are fictional and simulated in your browser.
   ============================================================ */

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const logU=(a,b)=>Math.exp(rand(Math.log(a),Math.log(b)));
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307179586*v)}
function wpick(o){let t=0;for(const k in o)t+=o[k];let r=Math.random()*t;for(const k in o){if((r-=o[k])<=0)return k}return Object.keys(o)[0]}
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const setText=(e,t)=>{if(e&&e.textContent!==t)e.textContent=t};

function fmtPrice(p){
  if(!(p>0))return '$0.00';
  if(p>=1000)return '$'+nf(p,2);
  if(p>=1)return '$'+nf(p,p>=100?2:3);
  if(p>=0.01)return '$'+p.toFixed(4);
  const [m,e]=p.toExponential(3).split('e');const ex=parseInt(e,10),digs=m.replace('.','');
  const zeros=-ex-1;
  if(zeros>=3)return '$0.0'+String(zeros).split('').map(d=>SUB[d]).join('')+digs.slice(0,4);
  return '$'+p.toFixed(zeros+4);
}

function fmtAge(s){s=Math.floor(s);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s';if(s<86400)return Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m';return Math.floor(s/86400)+'d '+String(Math.floor(s%86400/3600)).padStart(2,'0')+'h'}
function fmtDur(s){s=Math.round(s);if(s<3600)return Math.max(1,Math.round(s/60))+' min';if(s<86400){const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h+'h'+(m?' '+m+'m':'')}const d=Math.floor(s/86400),h=Math.round(s%86400/3600);return d+(d===1?' day':' days')+(h?' '+h+'h':'')}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<10)return 'Just now';if(s<60)return Math.floor(s)+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}

/* ============================================================
   MARKET ENGINE
   ------------------------------------------------------------
   Time: 1 step = 1 simulated second, and M.t counts them.
   While the app is open every coin and SOL advance one second
   at a time. When you come back after being away, the gap is
   replayed at 1x so the market carries on from exactly where
   you left it:
     - the final hour is replayed second by second,
     - older parts of the gap use 1-minute (or, past a week,
       1-hour) steps. Every noise term is an AR(1)/OU process,
       and these are aggregated exactly over a multi-second
       step, so a 60s step has the same statistics as sixty
       1s steps.
   History is kept at three resolutions so charts can reach
   back further than an hour without storing every second:
     h  : every second, last hour
     hm : every minute close, last 7 days
     hh : every hour close, last 2 years
   Each close is a real simulated price at that instant, not
   an average.
   ============================================================ */
const SEC_KEEP=3600, MIN_KEEP=10080, HR_KEEP=17520;
const SPAWN=1/300;               // launches per simulated second (about one every 5 min)
const MAX_CATCHUP=365*86400;     // replay at most a year of absence
const KEY='ghast.v1';            // old localStorage save, migrated on first run
const FATES={ // odds sum to 1: 49% duds/flat/rugs, 40% decent, 10% great, 1% moon
  rug:.12, dud:.22, flat:.15, decent:.40, great:.10, moon:.01
};
const TIERS={
  // sig: fast tick noise (reverts in ~20s). s2: size of the slow wandering that gives charts their trends.
  meme:{sig:[.004,.006],theta:.035,s2:.15,beta:.7,jump:.006,mcap:[5e4,1.5e6],liqR:[.15,.40]},
  alt: {sig:[.002,.003],theta:.05, s2:.07,beta:.9,jump:.002,mcap:[3e6,60e6],liqR:[.05,.12]},
  util:{sig:[.001,.002],theta:.06, s2:.04,beta:1, jump:.001,mcap:[2e7,4e8],liqR:[.03,.08]}
};
const TH2=.0003;                 // slow drift component, half-life ~40 min
const TIERW={ // which kind of token each fate tends to be
  rug:{meme:85,alt:12,util:3}, dud:{meme:60,alt:25,util:15}, flat:{meme:45,alt:30,util:25},
  decent:{meme:40,alt:35,util:25}, great:{meme:60,alt:30,util:10}, moon:{meme:85,alt:15,util:0}
};
// Active life in seconds (log-uniform): minutes to a few days. Rugs can strike fast or after a long slow pump.
const LIFE={rug:[300,43200],dud:[1800,86400],flat:[3600,86400],decent:[3600,86400],great:[7200,129600],moon:[14400,259200]};
// After its run ends, how much of the gain a coin gives back (share of its log gain)
const RETRACE={decent:[.2,.6],great:[.35,.75],moon:[.5,.85]};

const ADJ=['Turbo','Giga','Based','Sad','Angry','Baby','Mega','Dark','Lil','Sigma','Cursed','Wet','Toxic','Cosmic','Broke','Rich','Tiny','Sleepy','Dizzy','Feral','Lucky','Spicy','Shy','Ultra','Chad','Glitch','Haunted','Sus'];
const ANI=[['Frog','🐸'],['Dog','🐶'],['Cat','🐱'],['Ape','🦍'],['Duck','🦆'],['Hamster','🐹'],['Pig','🐷'],['Fox','🦊'],['Bear','🐻'],['Turtle','🐢'],['Unicorn','🦄'],['Banana','🍌'],['Pizza','🍕'],['Ghost','👻'],['Clown','🤡'],['Penguin','🐧'],['Shark','🦈'],['Octopus','🐙'],['Potato','🥔'],['Shroom','🍄'],['Chicken','🐔'],['Gator','🐊'],['Rex','🦖'],['Goat','🐐'],['Moon','🌙'],['Rocket','🚀'],['Skull','💀'],['Flame','🔥'],['Wizard','🧙'],['Alien','👽']];
const UP=['Nova','Orbit','Lumen','Vertex','Helix','Quanta','Nimbus','Aether','Zenith','Cipher','Pulse','Arc','Flux','Kite','Onyx','Prism','Tidal','Vector','Echo','Solstice','Axiom','Meridian','Cortex','Synth','Atlas','Ember','Halo','Rift','Sable','Tundra'];

function newMarket(){return{seq:0,t:0,coins:[],sol:{id:'SOL',kind:'sol',sym:'SOL',name:'Solana',ic:{k:'sol'},price:150,h:[150],hm:[],hh:[],anc:Math.log(150),reg:0,sv:0,supply:6.1e8}}}

/* ---- process helpers ---- */
// x' = a·x + s·z applied dt times in a row collapses to x' = a^dt·x + s·K·z
const AR1=[0,1];
function arK(a,dt){if(dt===1){AR1[0]=a;return AR1}const ad=Math.pow(a,dt);return[ad,Math.sqrt((1-ad*ad)/(1-a*a))]}
function pois(l){if(l<=0)return 0;if(l<30){let k=0,p=Math.exp(-l),s=p;const u=Math.random();while(u>s&&k<200){k++;p*=l/k;s+=p}return k}return Math.max(0,Math.round(l+Math.sqrt(l)*randn()))}

function rollFate(){return wpick(FATES)}

function makeIdentity(c){
  const used=new Set(M.coins.map(x=>x.sym)),names=new Set(M.coins.map(x=>x.name));
  for(let tries=0;tries<40;tries++){
    if(c.tier==='meme'){
      const a=pick(ADJ),[an,em]=pick(ANI);
      const name=Math.random()<.35?an:`${a} ${an}`;
      if(names.has(name))continue;
      let sym=(name.includes(' ')?a[0]+an:an).toUpperCase().slice(0,6);
      if(used.has(sym))sym=(sym.slice(0,5)+pick('XZKQ')).slice(0,6);
      if(used.has(sym))continue;
      c.name=name;c.sym=sym;c.ic={k:'e',e:em,h1:randi(0,360),h2:randi(0,360)};return;
    }
    const p=pick(UP),s=pick(US[c.tier]);
    const name=`${p} ${s}`;if(names.has(name))continue;let sym=p.toUpperCase().slice(0,randi(3,4));
    if(used.has(sym))sym=(sym.slice(0,3)+pick('XZKQ'));
    if(used.has(sym))continue;
    c.name=name;c.sym=sym;c.ic={k:'g',s:randi(0,5),h1:randi(0,360),h2:randi(0,360)};return;
  }
  c.name='Coin '+c.id;c.sym='C'+c.id.slice(1);c.ic={k:'g',s:0,h1:200,h2:280};
}

function makeCoin(opts={}){
  const fate=opts.fate||rollFate();
  const tier=wpick(TIERW[fate]),TT=TIERS[tier];
  const sc=tier==='util'?.5:tier==='alt'?.75:1;
  const c={id:'c'+(++M.seq),kind:'coin',fate,tier,bt:M.t,age:0,n:0,n2:0,sv:0,imp:0,mk:0,fade:0,dead:false,rugged:false,vol:0,v24:0,ve:0,addr:rAddr(44)};
  makeIdentity(c);
  c.supply=tier==='meme'?1e9:pick([1e8,5e8,1e9]);
  const mcap0=logU(...TT.mcap);
  c.p0=mcap0/c.supply;c.price=c.p0;c.L0=Math.log(c.p0);
  c.liq0=mcap0*rand(...TT.liqR);
  c.sig=rand(...TT.sig)*(fate==='moon'||fate==='great'?1.2:1);c.theta=TT.theta;c.beta=TT.beta;c.jump=TT.jump;
  c.s2i=TT.s2*rand(.7,1.3)*Math.sqrt(1-(1-TH2)*(1-TH2));
  c.T=opts.T||Math.round(logU(...LIFE[fate])*(tier==='util'?1.5:tier==='alt'?1.2:1));
  switch(fate){
    case'rug':c.Lp=Math.log(logU(1.2,6))*sc;c.k=rand(.8,1.6);c.ur=rand(.3,.85);c.Lfin=Math.log(rand(.002,.05));break;
    case'dud':c.L=Math.log(rand(.15,.8))*sc;c.k=rand(1.4,3);break;
    case'flat':c.L=Math.log(rand(.88,1.15))*sc;c.k=1;break;
    case'decent':c.L=Math.log(logU(1.25,5))*sc;c.k=rand(.7,1.8);break;
    case'great':c.L=Math.log(logU(6,40))*sc;c.k=rand(1.2,2.4);break;
    case'moon':c.L=Math.log(logU(60,1200))*sc;c.k=rand(2.2,3.4);break;
  }
  // what happens after the run: winners give back part of the gain, losers keep bleeding, flats drift
  c.fT=RETRACE[fate]?-c.L*rand(...RETRACE[fate]):fate==='dud'?Math.log(rand(.4,.85)):fate==='flat'?Math.log(rand(.8,1.05)):0;
  c.fTau=rand(7200,43200);
  // how long it stays listed once it is done (rugs: after the rug)
  c.Tl=fate==='rug'?rand(1800,5400):c.T*rand(.1,.3)+1800;
  c.wa=rand(.02,.09)*(fate==='flat'?1.2:1)*(1+Math.min(Math.abs(c.L||c.Lp||0),3)*.3);c.wf=rand(2,6);c.wp=rand(0,6.28);
  // visible "clues", correlated with fate but noisy on purpose
  c.top10=fate==='rug'?rand(35,82):rand(8,62);
  c.mintOn=Math.random()<(fate==='rug'?.7:.1);
  c.freezeOn=Math.random()<(fate==='rug'?.4:.08);
  c.h0=tier==='meme'?randi(40,900):tier==='alt'?randi(2000,40000):randi(5000,150000);
  c.about=pick(ABOUT[tier]);
  c.h=[c.price];c.hm=[];c.hh=[];
  return c;
}
const liqOf=c=>c.liq0*Math.pow(clamp(c.price/c.p0,.02,1000),.75)*(c.rugged?.02:1);
const poolQ=c=>Math.max(liqOf(c)/2,1);
const holdersOf=c=>Math.round(c.h0*Math.pow(clamp(c.price/c.p0,.3,300),.45)*(1+Math.min(c.age/Math.max(c.T,1),2)*.5));

function planLog(c){
  const u=c.age/c.T,uc=Math.min(u,1);
  const wave=(c.wa||0)*(Math.sin(6.2832*c.wf*uc+c.wp)-Math.sin(c.wp));
  if(c.fate==='rug'){
    if(c.age<c.ur*c.T)return c.Lp*Math.pow(uc/c.ur,c.k)+wave*.6;
    const d=Math.min(1,(c.age-c.ur*c.T)/6);
    return c.Lp+(c.Lfin-c.Lp)*d;
  }
  let s;
  if(c.fate==='dud')s=1-Math.pow(1-uc,c.k);
  else if(c.fate==='flat')s=uc*uc*(3-2*uc);
  else s=Math.pow(uc,c.k);
  return c.L*s+wave;
}

function stepCoin(c,rSol,dt){
  const a0=c.age;c.age+=dt;
  let A,K;
  [A,K]=arK(.97,dt);c.sv=A*c.sv+.1*K*randn();                 // volatility clustering
  const vm=Math.exp(.6*c.sv);
  [A,K]=arK(1-c.theta,dt);c.n=A*c.n+c.sig*vm*K*randn()*(c.dead?.12:1);   // fast noise, reverts in ~20s
  [A,K]=arK(1-TH2,dt);c.n2=A*c.n2+c.s2i*vm*K*randn()*(c.dead?.3:1);      // slow drift, reverts in ~40 min
  if(!c.dead){
    const nj=dt===1?(Math.random()<c.jump?1:0):pois(c.jump*dt);
    for(let j=0;j<nj;j++)c.n+=(Math.random()<.5?-1:1)*rand(.05,.2)*(c.tier==='meme'?1:.35)*(dt===1?1:Math.pow(1-c.theta,Math.random()*dt));
    c.mk+=c.beta*rSol;
  }
  c.imp*=Math.pow(.965,dt);                                      // your own trade's price effect fades
  if(c.age>c.T&&!c.rugged){const over=Math.min(dt,c.age-c.T);c.fade+=(c.fT-c.fade)*(1-Math.exp(-over/c.fTau))}
  if(c.fate==='rug'&&!c.rugged&&c.age>=c.ur*c.T){c.rugged=true;c.dead=true;c.theta=.25;c.justRugged=true}
  const prev=c.price;
  c.price=Math.exp(c.L0+planLog(c)+c.n+c.n2+c.imp+c.mk+c.fade);
  const act=dt===1?Math.abs(Math.log(c.price/prev)):.8*c.sig*vm;
  const v=liqOf(c)*(.004+2.2*act)*(dt===1?(.4+Math.random()):.9)*.0025*dt*(c.dead?.1:1);
  c.vol+=v;c.v24=c.v24*Math.exp(-dt/86400)+v;
  const e=Math.pow(.95,dt);c.ve=c.ve*e+(v/dt)*(1-e);
}
function stepSol(dt){
  const s=M.sol,a=.995,sr=5.5e-7;let A,K;
  [A,K]=arK(.98,dt);s.sv=A*s.sv+.06*K*randn();
  const vm=Math.exp(.6*s.sv);
  s.anc+=.00008*Math.sqrt(dt)*randn();                          // where SOL "wants" to be; wanders ~2.4% a day
  // short trends lasting a few minutes: an AR(1) drift, summed exactly over the step
  const r0=s.reg;let drift;
  if(dt===1){s.reg=a*r0+sr*randn();drift=s.reg}
  else{A=Math.pow(a,dt);
    const v=dt-2*a*(1-A)/(1-a)+a*a*(1-A*A)/(1-a*a);
    drift=r0*a*(1-A)/(1-a)+sr/(1-a)*Math.sqrt(Math.max(v,0))*randn();
    s.reg=A*r0+sr*Math.sqrt((1-A*A)/(1-a*a))*randn()}
  const x=Math.log(s.price),kap=.00002,e=Math.exp(-kap*dt);
  let x2=s.anc+(x-s.anc)*e+drift+.00018*vm*Math.sqrt((1-e*e)/(2*kap))*randn();
  const nj=dt===1?(Math.random()<.0008?1:0):pois(.0008*dt);
  for(let j=0;j<nj;j++)x2+=(Math.random()<.5?-1:1)*rand(.004,.012);
  s.price=Math.exp(x2);
  return x2-x;
}
// record closes into the three history buffers
function rec(t,dt){
  if(dt===1){t.h.push(t.price);if(t.h.length>SEC_KEEP+240)t.h.splice(0,t.h.length-SEC_KEEP-1)}
  if(dt<=60&&M.t%60===0){t.hm.push(t.price);if(t.hm.length>MIN_KEEP+240)t.hm.splice(0,t.hm.length-MIN_KEEP)}
  if(M.t%3600===0){t.hh.push(t.price);if(t.hh.length>HR_KEEP+48)t.hh.splice(0,t.hh.length-HR_KEEP)}
}
function spawn(opts){const c=makeCoin(opts);M.coins.push(c);REG[c.id]=c;return c}
function cull(){
  const keep=c=>W&&(W.H[c.id]||c.id===S.detail||c.id===S.swap.from||c.id===S.swap.to);
  const done=c=>c.rugged?c.age>c.ur*c.T+c.Tl:c.age>c.T+c.Tl;
  const rm=new Set(M.coins.filter(c=>!keep(c)&&done(c)).map(c=>c.id));
  const MAXC=160; // safety valve only; normal churn keeps the list near 100
  const left=M.coins.length-rm.size;
  if(left>MAXC)M.coins.filter(c=>!rm.has(c.id)&&!keep(c)).sort((a,b)=>b.age/b.T-a.age/a.T).slice(0,left-MAXC).forEach(c=>rm.add(c.id));
  if(rm.size){M.coins=M.coins.filter(c=>!rm.has(c.id));reindex()}
}
function stepAll(dt=1){
  M.t+=dt;
  const r=stepSol(dt);rec(M.sol,dt);
  for(const c of M.coins){stepCoin(c,r,dt);rec(c,dt)}
  if(dt<3600){const k=dt===1?(Math.random()<SPAWN?1:0):pois(SPAWN*dt);for(let i=0;i<k;i++)spawn()}
  if(dt>1||M.t%15===0)cull();
}
// Replay G seconds of market time. Deterministic structure, random path, consistent with everything before it.
async function advance(G,prog,hook){
  G=Math.floor(Math.min(G,MAX_CATCHUP));if(G<=0)return;
  const WEEK=MIN_KEEP*60,HOUR=SEC_KEEP;
  let rem=G,hourly=false,macro=false,lastY=performance.now();
  const tick=async dt=>{
    stepAll(dt);rem-=dt;if(hook)hook();
    if(performance.now()-lastY>35){lastY=performance.now();if(prog)prog(1-rem/G);await new Promise(r=>setTimeout(r,0))}
  };
  if(rem>WEEK+2*HOUR){                       // more than a week: hourly steps for the oldest part
    while(M.t%60&&rem>WEEK)await tick(1);
    while(M.t%3600&&rem>WEEK)await tick(60);
    while(rem-3600>=WEEK){await tick(3600);hourly=true}
    macro=true;
  }
  if(hourly)for(const t of allTok())t.hm=[];  // minute closes older than a week are out of range anyway
  if(rem>HOUR+120){                          // minute steps up to the final hour
    while(M.t%60&&rem>HOUR)await tick(1);
    while(rem-60>=HOUR){await tick(60);macro=true}
  }
  if(macro)for(const t of allTok())t.h=[t.price]; // second-level history restarts for the final hour
  while(rem>0)await tick(1);
  if(prog)prog(1);
}
// A new wallet gets a market that has already been running for three days, so charts have real history.
async function seedMarket(prog){
  M=newMarket();reindex();
  const WARM=3*86400;
  const mT=Math.round(logU(...LIFE.moon));                // a fresh wallet always has one moonshot mid-run to chase
  const at=WARM-Math.min(Math.round(mT*rand(.12,.35)),WARM-7200);
  let placed=false;
  await advance(WARM,prog,()=>{if(!placed&&M.t>=at){placed=true;spawn({fate:'moon',T:mT})}});
  M.coins.forEach(c=>c.justRugged=false);
}

let W=null;
const NET_FEE=.00005;
function newWallet(){
  const p=M.sol.price;
  return{addr:rAddr(44),name:'Account 1',H:{SOL:{amt:100000/p,cost:100000}},acts:[],dep:100000};
}
const snap=t=>({id:t.id,sym:t.sym,name:t.name,ic:t.ic});
const bal=id=>(W.H[id]&&W.H[id].amt)||0;
function portfolioValue(){let v=0;for(const id in W.H){const t=T(id);if(t)v+=W.H[id].amt*t.price}return v}
// Where each history buffer starts, in simulated seconds (its last point is the latest close)
function bufs(t){
  const tm=M.t-M.t%60,th=M.t-M.t%3600;
  return[{a:t.h,res:1,start:M.t-(t.h.length-1),now:false},
         {a:t.hm,res:60,start:tm-(t.hm.length-1)*60,now:true},
         {a:t.hh,res:3600,start:th-(t.hh.length-1)*3600,now:true}].filter(b=>b.a.length);
}
// price s seconds ago, from the finest buffer that reaches that far back
function histAt(t,s){
  if(s<=0||!t.h)return t.price;
  const want=M.t-s;
  for(const b of bufs(t))if(b.start<=want){const i=b.a.length-1-Math.floor((b.start+(b.a.length-1)*b.res-want)/b.res);return b.a[Math.max(0,i)]}
  return earliest(t);
}
function earliest(t){if(t.kind==='coin')return t.p0;const B=bufs(t);return B.length?B.reduce((x,y)=>y.start<x.start?y:x).a[0]:t.price}
// % change over w seconds (0 = since launch / all history)
function chg(t,w){
  if(t.kind==='stable')return 0;
  const b=(w===0||(t.kind==='coin'&&w>=t.age))?earliest(t):histAt(t,w);
  return b>0?t.price/b-1:0;
}
// points + their timestamps covering the last `win` seconds (0 = everything)
function series(t,win){
  const age=t.kind==='coin'?t.age:Infinity,span=win?Math.min(win,age):age,want=M.t-span;
  const B=bufs(t);if(!B.length)return{pts:[t.price,t.price],ts:[M.t-1,M.t]};
  const b=B.find(b=>b.start<=want+b.res)||B.reduce((x,y)=>y.start<x.start?y:x);
  const from=Math.max(0,Math.ceil((want-b.start)/b.res));
  const pts=b.a.slice(from),ts=pts.map((_,i)=>b.start+(from+i)*b.res);
  if(b.now&&ts[ts.length-1]<M.t){pts.push(t.price);ts.push(M.t)}
  if(t.kind==='coin'&&want<=t.bt&&ts[0]>t.bt){pts.unshift(t.p0);ts.unshift(t.bt)}   // include the launch price
  if(pts.length<2){pts.unshift(pts[0]);ts.unshift(ts[0]-1)}
  return{pts,ts};
}
// thin a series for drawing: keep each bucket's low and high in order, so spikes and crashes survive
function thin(S_,n){
  const{pts,ts}=S_,L=pts.length;if(L<=n*2)return S_;
  const P=[pts[0]],Tt=[ts[0]],bs=(L-2)/n;
  for(let k=0;k<n;k++){
    const a=1+Math.floor(k*bs),b=Math.min(L-1,1+Math.floor((k+1)*bs));let lo=a,hi=a;
    for(let i=a;i<b;i++){if(pts[i]<pts[lo])lo=i;if(pts[i]>pts[hi])hi=i}
    const o=lo===hi?[lo]:lo<hi?[lo,hi]:[hi,lo];for(const i of o){P.push(pts[i]);Tt.push(ts[i])}
  }
  P.push(pts[L-1]);Tt.push(ts[L-1]);return{pts:P,ts:Tt};
}

function quote(fromId,toId,amt){
  const f=T(fromId),t=T(toId);
  if(!f||!t||!(amt>0)||fromId===toId)return null;
  let usdG;
  if(f.kind==='coin'){const Rq=poolQ(f),Rb=Rq/f.price;usdG=Rq*amt/(Rb+amt)}else usdG=amt*f.price;
  const rate=(f.kind==='coin'||t.kind==='coin')?.005:.001;
  const fee=usdG*rate,usdN=usdG-fee;
  let out,Rqt=0;
  if(t.kind==='coin'){Rqt=poolQ(t);const Rbt=Rqt/t.price;out=Rbt*usdN/(Rqt+usdN)}else out=usdN/t.price;
  const mid=amt*f.price/t.price;
  return{f,t,amt,out,usdG,fee,usdN,rate,mid,Rqt,impact:Math.max(0,1-out/(mid*(1-rate)))};
}
function execSwap(fromId,toId,amt,minOut){
  const h=W.H[fromId];
  if(!h||amt>h.amt*(1+1e-9))return{ok:false,err:'Insufficient balance.'};
  amt=Math.min(amt,h.amt);
  const q=quote(fromId,toId,amt);
  if(!q)return{ok:false,err:'Invalid swap.'};
  if(q.out<minOut)return{ok:false,err:'Slippage tolerance exceeded. The price moved before your swap landed. Try again or raise slippage.'};
  const sol=W.H.SOL;
  if(fromId==='SOL'){if(h.amt-amt<NET_FEE-1e-12)return{ok:false,err:'Not enough SOL left for the network fee.'}}
  else if(!sol||sol.amt<NET_FEE)return{ok:false,err:'You need a little SOL to pay the network fee.'};
  const frac=amt/h.amt,costOut=h.cost*frac;
  h.amt-=amt;h.cost-=costOut;
  const s=W.H.SOL;
  if(s.amt>0)s.cost*=Math.max(0,(s.amt-NET_FEE)/s.amt);
  s.amt=Math.max(0,s.amt-NET_FEE);
  const ht=W.H[toId]||(W.H[toId]={amt:0,cost:0});
  ht.amt+=q.out;ht.cost+=q.usdN;
  for(const id in W.H)if(id!=='SOL'&&W.H[id].amt<1e-9)delete W.H[id];
  if(q.f.kind==='coin'){const Rq=poolQ(q.f);q.f.imp=clamp(q.f.imp-Math.log(1+amt/(Rq/q.f.price)),-3,3);q.f.vol+=q.usdG;q.f.v24+=q.usdG}
  if(q.t.kind==='coin'){q.t.imp=clamp(q.t.imp+Math.log(1+q.usdN/q.Rqt),-3,3);q.t.vol+=q.usdN;q.t.v24+=q.usdN}
  const pnl=q.f.kind==='stable'?null:q.usdN-costOut;
  addAct({type:'swap',from:snap(q.f),fromAmt:amt,to:snap(q.t),toAmt:q.out,usd:q.usdG,fee:q.fee,pnl});
  return{ok:true,q,pnl};
}
function addAct(a){a.id=rAddr(10);a.ts=Date.now();a.sig=rAddr(88);W.acts.unshift(a);if(W.acts.length>200)W.acts.length=200;S.actDirty=true}
function execSend(id,amt,to){
  const h=W.H[id];
  if(!h||amt>h.amt*(1+1e-9))return{ok:false,err:'Insufficient balance.'};
  const sol=W.H.SOL;
  if(id==='SOL'&&h.amt-amt<NET_FEE-1e-12)return{ok:false,err:'Not enough SOL left for the network fee.'};
  if(id!=='SOL'&&(!sol||sol.amt<NET_FEE))return{ok:false,err:'You need a little SOL to pay the network fee.'};
  amt=Math.min(amt,h.amt);const t=T(id);
  const costOut=h.cost*(amt/h.amt);h.amt-=amt;h.cost-=costOut;
  if(W.H.SOL.amt>0)W.H.SOL.cost*=Math.max(0,(W.H.SOL.amt-NET_FEE)/W.H.SOL.amt);
  W.H.SOL.amt=Math.max(0,W.H.SOL.amt-NET_FEE);
  W.dep-=amt*t.price;
  for(const k in W.H)if(k!=='SOL'&&W.H[k].amt<1e-9)delete W.H[k];
  addAct({type:'send',from:snap(t),fromAmt:amt,usd:amt*t.price,to:{sym:shortA(to)},toAddr:to});
  return{ok:true};
}
function deposit(id,usd){
  const t=T(id),amt=usd/t.price;
  const h=W.H[id]||(W.H[id]={amt:0,cost:0});h.amt+=amt;h.cost+=usd;W.dep+=usd;
  addAct({type:'receive',to:snap(t),toAmt:amt,usd});
}

/* ============================================================
   PERSISTENCE
   ------------------------------------------------------------
   Saved to IndexedDB (localStorage tops out around 5 MB).
   The save is split into many small records written in ONE
   transaction: Chrome moves any value over ~64 KB out to a
   separate blob file, and if the app is killed mid-write that
   file can be left unreadable, which would lose the wallet.
   Small records stay inline, and the single transaction means
   a save either fully lands or leaves the previous one intact.
   History buffers are stored as Float32 (~7 significant
   digits, plenty for charts); live prices are full precision.
   The save stamps the wall-clock time, so reopening the app
   replays exactly the time you were gone.
   ============================================================ */
const CH_S=16000, CH_F=12000;     // chars per text record, floats per history record (both < 40 KB)
const Store={
  db:undefined,
  open(){
    if(this.db!==undefined)return Promise.resolve(this.db);
    return new Promise(res=>{
      try{
        if(!self.indexedDB)return res(this.db=null);
        const r=indexedDB.open('ghast',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>res(this.db=r.result);
        r.onerror=r.onblocked=()=>res(this.db=null);
      }catch(e){res(this.db=null)}
    });
  },
  // replace the whole save atomically
  async write(recs){
    const db=await this.open();
    if(!db)return false;
    return new Promise(res=>{try{
      const tx=db.transaction('kv','readwrite'),st=tx.objectStore('kv');
      st.clear();for(const k in recs)st.put(recs[k],k);
      tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false);
    }catch(e){res(false)}});
  },
  async read(){
    const db=await this.open();
    if(!db)return undefined;
    return new Promise(res=>{try{
      const tx=db.transaction('kv'),st=tx.objectStore('kv'),out={};
      const hq=st.get('head');
      hq.onsuccess=()=>{
        const h=hq.result;if(!h||h.v!==3)return res(undefined);
        out.head=h;out.s=[];out.f=[];
        for(let i=0;i<h.ns;i++){const q=st.get('s'+i);q.onsuccess=()=>out.s[i]=q.result}
        for(let i=0;i<h.nf;i++){const q=st.get('f'+i);q.onsuccess=()=>out.f[i]=q.result}
      };
      tx.oncomplete=()=>res(out.head?out:undefined);tx.onerror=tx.onabort=()=>res(undefined);
    }catch(e){res(undefined)}});
  },
  async clear(){try{localStorage.removeItem('ghast.state')}catch(e){}return this.write({})}
};
function packState(){
  const arrs=[];let off=0;
  const ref=a=>{arrs.push(a);const r=[off,a.length];off+=a.length;return r};
  const pk=t=>({...t,h:ref(t.h),hm:ref(t.hm),hh:ref(t.hh)});
  const meta={wall:Date.now(),M:{t:M.t,seq:M.seq,sol:pk(M.sol),coins:M.coins.map(pk)},W,S:{speed:S.speed,slip:S.slip,refresh:S.refresh}};
  const all=new Float32Array(off);let p=0;for(const a of arrs){all.set(a,p);p+=a.length}
  return{meta,all};
}
function toRecords({meta,all}){
  const js=JSON.stringify(meta),recs={};let ns=0,nf=0;
  for(let i=0;i<js.length||i===0;i+=CH_S)recs['s'+(ns++)]=js.slice(i,i+CH_S);
  for(let i=0;i<all.length;i+=CH_F)recs['f'+(nf++)]=all.slice(i,i+CH_F);
  recs.head={v:3,ns,nf,wall:meta.wall};
  return recs;
}
function fromRecords(r){
  if(r.s.length!==r.head.ns||r.f.length!==r.head.nf||r.s.some(x=>typeof x!=='string')||r.f.some(x=>!x))return null;
  const meta=JSON.parse(r.s.join(''));
  let n=0;for(const f of r.f)n+=f.length;
  const all=new Float32Array(n);let p=0;for(const f of r.f){all.set(f,p);p+=f.length}
  const uk=t=>{for(const k of['h','hm','hh']){const[o,l]=t[k];t[k]=Array.from(all.subarray(o,o+l))}if(!t.h.length)t.h=[t.price];return t};
  meta.M.sol=uk(meta.M.sol);meta.M.coins=meta.M.coins.map(uk);
  return meta;
}
let saving=null,saveAgain=false;
function save(){
  if(!M||!W||S.resetting||S.catching)return Promise.resolve();
  if(saving){saveAgain=true;return saving}
  const snap=packState();   // snapshot now, so wall time and market state always match
  saving=(async()=>{
    let ok=await Store.write(toRecords(snap));
    if(!ok&&Store.db===null){ // no IndexedDB at all: smaller JSON copy with 15 min of per-second history
      try{
        const{meta,all}=snap,cp=JSON.parse(JSON.stringify(meta));
        const put=t=>{for(const k of['h','hm','hh']){const[o,l]=t[k];let a=Array.from(all.subarray(o,o+l),x=>+x.toPrecision(6));if(k==='h')a=a.slice(-900);t[k]=a}};
        put(cp.M.sol);cp.M.coins.forEach(put);
        localStorage.setItem('ghast.state',JSON.stringify(cp));ok=true;
      }catch(e){}
    }
    saving=null;
    if(ok&&!S.migrated){S.migrated=true;try{localStorage.removeItem(KEY)}catch(e){}}
    if(saveAgain){saveAgain=false;return save()}
  })();
  return saving;
}
// The first version kept up to 3000 one-second points per token in localStorage and nothing longer.
function migrateV1(d){
  const up=t=>{
    t.h=(t.h&&t.h.length?t.h:[t.price]).slice(-(SEC_KEEP+1));
    t.hm=[];const n=t.h.length;for(let i=0;i<n;i++)if((d.M.t-(n-1-i))%60===0)t.hm.push(t.h[i]);
    t.hh=[];return t;
  };
  const sol=up(d.M.sol);sol.anc=Math.log(sol.price);sol.reg=0;sol.sv=sol.sv||0;
  const coins=d.M.coins.map(c=>{
    up(c);c.bt=d.M.t-c.age;c.n2=0;c.v24=c.vol||0;
    c.s2i=TIERS[c.tier].s2*Math.sqrt(1-(1-TH2)*(1-TH2));
    c.fT=c.fade||0;c.fTau=43200;          // old coins had an endless linear decay; freeze it where it is
    c.Tl=c.fate==='rug'?1800:c.T*.2+1800;
    delete c.born;delete c.decay;return c;
  });
  return{wall:d.t,M:{t:d.M.t,seq:d.M.seq,sol,coins},W:d.W,S:d.S||{}};
}
async function loadSaved(){
  try{
    const r=await Store.read();
    const d=r&&fromRecords(r);
    if(d&&d.M&&d.W&&d.M.sol&&Array.isArray(d.M.coins))return d;
  }catch(e){}
  try{ // fallback copy (browsers without IndexedDB)
    const raw=localStorage.getItem('ghast.state');
    if(raw){const d=JSON.parse(raw);if(d&&d.M&&d.W)return d}
  }catch(e){}
  try{
    const raw=localStorage.getItem(KEY);if(!raw)return null;
    const d=JSON.parse(raw);
    if(d.v!==1||!d.M||!d.W||!d.M.sol||!Array.isArray(d.M.coins))return null;
    return migrateV1(d);
  }catch(e){return null}
}

/* ---------- shared row helpers ---------- */
function syncRows(container,items,build,upd){
  const map=container._m||(container._m=new Map());
  const seen=new Set();
  items.forEach((it,i)=>{
    const k=it.id;seen.add(k);
    let e=map.get(k);if(!e){e=build(it);map.set(k,e)}
    upd(e,it);
    const at=container.children[i];if(at!==e)container.insertBefore(e,at||null);
  });
  for(const [k,e] of map)if(!seen.has(k)){e.remove();map.delete(k)}
}
const q=(e,s)=>e.querySelector(s);
function paths(pts,W_=360,H_=200,pad=14,padX=0){
  if(pts.length<2)pts=[pts[0],pts[0]];
  let mn=Infinity,mx=-Infinity;for(const v of pts){if(v<mn)mn=v;if(v>mx)mx=v}
  if(mx===mn){mx=mn*1.001+1e-15;mn=mn*.999}
  const n=pts.length,ys=v=>pad+(1-(v-mn)/(mx-mn))*(H_-2*pad);
  let d='';for(let i=0;i<n;i++)d+=(i?'L':'M')+(padX+(i/(n-1))*(W_-2*padX)).toFixed(1)+' '+ys(pts[i]).toFixed(1);
  return{line:d,area:d+`L${W_-padX} ${H_}L${padX} ${H_}Z`,lastY:ys(pts[n-1]),ys,n};
}

function exTick(){
  if(S.exDirty||M.t-S.exAt>=5||!S.exIds.length){
    S.exAt=M.t;
    let list=M.coins.slice();
    const qq=S.q.trim().toLowerCase();
    if(qq)list=list.filter(c=>c.name.toLowerCase().includes(qq)||c.sym.toLowerCase().includes(qq));
    const w=S.win,ch=c=>chg(c,w);
    if(S.ex==='trend')list.sort((a,b)=>b.ve/liqOf(b)-a.ve/liqOf(a));
    else if(S.ex==='new')list.sort((a,b)=>a.age-b.age);
    else if(S.ex==='gain')list.sort((a,b)=>ch(b)-ch(a));
    else list.sort((a,b)=>ch(a)-ch(b));
    if(!qq&&S.ex!=='lose')list.sort((a,b)=>(a.rugged?1:0)-(b.rugged?1:0)); // dead tokens never headline Trending/New/Gainers (stable sort keeps order otherwise)
    S.exIds=list.slice(0,qq?list.length:60).map(c=>c.id);S.exDirty=false;
  }
  const items=S.exIds.filter(id=>T(id)).map(id=>({id}));
  $('#exEmpty').style.display=items.length?'none':'block';
  syncRows($('#exList'),items,
    ({id})=>{const c=T(id);const e=el(`<div class="row" style="padding-left:2px;padding-right:2px"><span>${iconHTML(c.ic,44)}</span><div class="mid"><div class="t1"></div><div class="t2"></div></div><svg class="spark" viewBox="0 0 60 26" preserveAspectRatio="none"><path/></svg><div class="rt" style="min-width:74px"><div class="t1"></div><div class="t2"></div></div></div>`);e.onclick=()=>openDetail(id);return e},
    (e,{id})=>{
      const c=T(id),ch=chg(c,S.win);
      const n=q(e,'.mid .t1');
      if(n.firstChild===null||n.firstChild.textContent!==c.name)n.textContent=c.name;
      const wantTag=c.rugged?'r':(c.age<1800?'n':'');
      const tag=n.querySelector('.tag');
      if(wantTag&&!tag)n.insertAdjacentHTML('beforeend',`<span class="tag ${wantTag}">${wantTag==='r'?'RUGGED':'NEW'}</span>`);
      else if(!wantTag&&tag)tag.remove();
      else if(tag&&wantTag&&!tag.classList.contains(wantTag)){tag.className='tag '+wantTag;tag.textContent=wantTag==='r'?'RUGGED':'NEW'}
      setText(q(e,'.mid .t2'),`${c.sym} · MC ${fmtC(c.price*c.supply)}`);
      setText(q(e,'.rt .t1'),fmtPrice(c.price));
      const r2=q(e,'.rt .t2');setText(r2,fmtPct(ch));r2.className='t2 '+(ch>0.00005?'up':ch<-0.00005?'dn':'');
      const pts=thin(series(c,S.win),28).pts;
      const p=paths(pts,60,26,2);
      const pe=q(e,'.spark path');pe.setAttribute('d',p.line);pe.setAttribute('stroke',pts[pts.length-1]>=pts[0]?'#2fe08b':'#ff5c5c');
    });
}

  const xh=$('#dXh'),xd=$('#dXd');

function qrSVG(str,px=210){
  let h=0;for(const ch of str)h=(h*31+ch.charCodeAt(0))>>>0;
  let s=h||1;const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296};
  const N=27;let r='';
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if((x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9))continue;
    if(rnd()<.5)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`;
  }
  return `<svg viewBox="-2 -2 ${N+4} ${N+4}" width="${px}" height="${px}"><rect x="-2" y="-2" width="${N+4}" height="${N+4}" fill="#fff"/>${r}${fin(0,0)}${fin(N-7,0)}${fin(0,N-7)}</svg>`;
}

function notifyRugs(){
  for(const c of M.coins){
    if(c.justRugged){
      c.justRugged=false;
      if(W.H[c.id]){toast(`<b>${c.sym}</b> just got rugged. Liquidity was pulled.`,'bad','alert',()=>openDetail(c.id));refreshNow()}
    }
  }
}
function stampR(){S.lastR=Date.now();updAge()}
function updAge(){
  const u=$('#balU');if(!u)return;
  if(!S.refresh){setText(u,'Live prices');return}
  const a=Math.floor((Date.now()-S.lastR)/1000);
  setText(u,(a<1?'Prices just updated':`Prices updated ${a}s ago`)+' \u00b7 tap the total to update');
}
function refreshNow(){
  stampR();renderTick();
  const b=$('#balV');if(b){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
}
function renderTick(){
  homeTick();
  if(S.tab==='explore')exTick();
  if(S.tab==='swap')swapTick();
  if(S.detail)detailTick();
  revTick();
  if(S.tab==='activity'&&(S.actDirty||++S.actC%10===0))renderActivity();
}
let last=Date.now(),carry=0,lastSave=Date.now();
function loop(){
  if(S.catching)return;
  const now=Date.now(),el=(now-last)/1000;last=now;
  // Back from the background or from sleep: replay the gap at 1x, exactly as if the app had been closed.
  if(el>20){catchUp(el);return}
  carry+=el*S.speed;
  const n=Math.floor(carry);carry-=n;
  if(n<=0)return;
  for(let i=0;i<n;i++)stepAll(1);
  notifyRugs();
  /* The market keeps ticking every second underneath, but the screen only
     redraws on the refresh interval, so prices sit still long enough to read. */
  if(!S.refresh||now-S.lastR>=S.refresh*1000){S.lastR=now;renderTick()}
  updAge();
  revTick(); // the review sheet is a live decision screen, never frozen
  if(now-lastSave>5000){lastSave=now;save()}
}

/* ---------- catching up after time away ---------- */
function catchUI(on,label){
  let o=$('#catch');
  if(!on){if(o)o.classList.remove('on');return}
  if(!o){o=el(`<div id="catch"><div class="logo">${ghast(64)}</div><div class="cl"></div><div class="bar"><i></i></div></div>`);$('#app').appendChild(o)}
  setText($('.cl',o),label);$('.bar i',o).style.width='0%';o.classList.add('on');
}
const catchProg=p=>{const b=$('#catch .bar i');if(b)b.style.width=(p*100).toFixed(1)+'%'};
async function catchUp(sec,{quiet=false}={}){
  sec=Math.floor(sec);if(sec<=0)return;
  S.catching=true;
  const held=Object.keys(W.H).filter(id=>T(id)&&T(id).kind!=='stable');
  const before={pv:portfolioValue(),px:Object.fromEntries(held.map(id=>[id,T(id).price]))};
  M.coins.forEach(c=>c.justRugged=false);
  const big=sec>90;
  if(big){catchUI(true,`Catching up on ${fmtDur(sec)} of market`);await new Promise(r=>setTimeout(r,30))}
  try{await advance(sec,big?catchProg:null)}finally{S.catching=false}
  last=Date.now();carry=0;
  const rugs=M.coins.filter(c=>c.justRugged&&W.H[c.id]);M.coins.forEach(c=>c.justRugged=false);
  catchUI(false);
  refreshNow();S.exDirty=true;
  save();
  if(!quiet&&sec>=600)awaySummary(sec,before,rugs);
  else for(const c of rugs)toast(`<b>${c.sym}</b> got rugged while you were away.`,'bad','alert',()=>openDetail(c.id));
}
function awaySummary(sec,before,rugs){
  const pv=portfolioValue(),d=pv-before.pv,p=before.pv>0?d/before.pv:0;
  const rows=Object.keys(before.px).filter(id=>T(id)&&W.H[id]).map(id=>{const t=T(id);return{t,c:t.price/before.px[id]-1,v:W.H[id].amt*t.price}}).sort((a,b)=>b.v-a.v).slice(0,6);
  const rug=new Set(rugs.map(c=>c.id));
  openSheet('While you were away',`
    <p class="away-l">The market ran for ${fmtDur(sec)} without you.</p>
    <div class="card away"><div class="k">Portfolio</div><div class="v">${fmtUSD(pv)}</div><div class="${d>=0?'up':'dn'}" style="font-weight:600">${sUSD(d)} (${fmtPct(p)})</div></div>
    ${rows.map(r=>`<div class="row" style="padding-left:2px;padding-right:2px"><span>${iconHTML(r.t.ic,38)}</span><div class="mid"><div class="t1">${r.t.sym}${rug.has(r.t.id)?'<span class="tag r">RUGGED</span>':''}</div><div class="t2">${fmtUSD(r.v)}</div></div><div class="rt"><div class="t1 ${r.c>=0?'up':'dn'}">${fmtPct(r.c)}</div></div></div>`).join('')}
    <div style="height:14px"></div><button class="btn" data-a="closeSheet">Got it</button>`);
}

async function boot(){
  let saved=await loadSaved(),fresh=false,gap=0;
  if(saved){
    M=saved.M;W=saved.W;
    S.speed=saved.S.speed||1;S.slip=saved.S.slip||.05;S.refresh=saved.S.refresh!=null?saved.S.refresh:30;
    reindex();
    gap=Math.max(0,(Date.now()-saved.wall)/1000);
  }else{
    S.catching=true;
    catchUI(true,'Starting the market');
    await new Promise(r=>setTimeout(r,30));
    await seedMarket(catchProg);
    S.catching=false;catchUI(false);
    W=newWallet();fresh=true;
  }
  buildNav();buildHome();buildSwap();buildExplore();buildActivity();
  renderSwapChips();homeTick();stampR();
  if(fresh)showLock('new');
  if(gap>=1)await catchUp(gap);
  S.base=portfolioValue();homeTick();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  last=Date.now();
  setInterval(loop,200);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else loop()});
  window.addEventListener('pagehide',()=>save());
  save();
}
boot();
</script>
<script>
/* Registers the service worker, which is what makes Chrome offer "Install app"
   instead of a plain home-screen shortcut. Silently skipped on file:// or http://. */
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
